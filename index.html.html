<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Recuerdo Especial</title>
    <style>
        /* Pantalla completa y fondo negro profundo */
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Video optimizado para celulares */
        video { 
            width: 100vw; 
            height: 100vh; 
            object-fit: contain; /* Mantiene la proporción sin estirar */
            display: block;
        }

        /* Botón de sonido estilizado */
        #btnSonido {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            padding: 18px 35px;
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            z-index: 100;
            transition: all 0.3s ease;
        }

        #btnSonido:active {
            transform: translateX(-50%) scale(0.9);
            background: #fff;
        }

        /* Mensaje de error si el video no carga */
        #errorMsg {
            display: none;
            color: white;
            text-align: center;
            padding: 20px;
            position: absolute;
        }
    </style>
</head>
<body>

    <div id="errorMsg">
        <p>⚠️ No se encontró el archivo <b>video.mp4</b></p>
        <p>Asegúrate de que el video esté en la misma carpeta que este código.</p>
    </div>

    <video id="miVideo" playsinline autoplay muted loop preload="auto">
        <source src="video.mp4" type="video/mp4">
        <source src="video.mov" type="video/quicktime">
        Tu navegador no es compatible con este video.
    </video>

    <button id="btnSonido" onclick="activarAudio()">🔊 Tocar para escuchar</button>

    <script>
        const video = document.getElementById('miVideo');
        const btn = document.getElementById('btnSonido');
        const error = document.getElementById('errorMsg');

        // Función para activar el audio
        function activarAudio() {
            video.muted = false;
            video.play();
            btn.style.display = 'none';
        }

        // Si el video falla al cargar, muestra el error
        video.onerror = function() {
            video.style.display = 'none';
            btn.style.display = 'none';
            error.style.display = 'block';
        };

        // Forzar reproducción al cargar (en silencio)
        window.addEventListener('load', () => {
            video.play().catch(e => console.log("Esperando interacción..."));
        });
    </script>
</body>
</html>
